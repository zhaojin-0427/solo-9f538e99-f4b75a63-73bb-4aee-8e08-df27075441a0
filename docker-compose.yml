services:
  gapcheck:
    build: .
    image: gapcheck-api:latest
    container_name: gapcheck-api
    ports:
      - "8000:8000"
    environment:
      GAPCHECK_DB_PATH: /data/gapcheck.db
    volumes:
      - gapcheck-data:/data
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health').status==200 else 1)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

volumes:
  gapcheck-data:
